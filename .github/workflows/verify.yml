name: verify

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  SANITY_PROJECT_ID: 85i3osnk
  SANITY_DATASET: production

# This org allows only GitHub-owned actions and requires them pinned to a
# commit SHA, so pnpm/action-setup is unavailable. Corepack ships with Node and
# reads the `packageManager` field in the root package.json, which pins the
# exact pnpm version — the same guarantee action-setup would have given us.
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: corepack enable
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
