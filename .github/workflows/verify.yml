name: verify

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

# Read-only: this workflow only ever checks out and tests. Without the block a
# job inherits the repository default, which can be read-write, so a compromised
# dependency in `pnpm install` would run with a token that can push.
permissions:
  contents: read

env:
  SANITY_PROJECT_ID: 85i3osnk
  SANITY_DATASET: production

# Actions are pinned to commit SHAs because the org requires it. The trailing
# comment records the human-readable tag each SHA corresponds to; update both
# together. pnpm/action-setup reads the `packageManager` field in the root
# package.json, so the pnpm version is pinned there rather than duplicated here.
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  # Reporting, not gating: `pnpm verify` above already fails the run on any lint
  # error. This exists so findings land as annotations on the diff and as
  # history in the Security tab instead of only in a log nobody scrolls.
  #
  # `security-events: write` stays in this job. It is the one permission that
  # could matter if something in the dependency tree ran away with the token, so
  # the job that needs it does nothing else.
  eslint-sarif:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # eslint exits non-zero when it finds anything, which is the normal case
      # here — the findings still have to be converted and uploaded. A genuine
      # failure (unreadable config, no output at all) surfaces at the next step,
      # which errors rather than uploading an empty run.
      - run: pnpm --filter site exec eslint . -f json -o "$GITHUB_WORKSPACE/eslint-site.json"
        continue-on-error: true
      - run: pnpm --filter studio exec eslint . -f json -o "$GITHUB_WORKSPACE/eslint-studio.json"
        continue-on-error: true
      - run: node scripts/eslint-sarif.mjs eslint-site.json eslint-studio.json > eslint.sarif
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: eslint.sarif
          # Distinct from CodeQL's own categories, or one upload would be taken
          # for a stale version of the other and close its alerts.
          category: eslint
          wait-for-processing: true

  # New coverage rather than a second opinion: nothing else here fails a PR that
  # introduces a dependency with a known advisory. Dependabot only reports on
  # what is already merged.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
