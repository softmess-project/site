name: verify

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  SANITY_PROJECT_ID: 85i3osnk
  SANITY_DATASET: production

# Actions are pinned to commit SHAs because the org requires it. The trailing
# comment records the human-readable tag each SHA corresponds to; update both
# together. pnpm/action-setup reads the `packageManager` field in the root
# package.json, so the pnpm version is pinned there rather than duplicated here.
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
